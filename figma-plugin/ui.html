<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font: 12px/1.45 Inter, system-ui, sans-serif;
    color: var(--figma-color-text);
    background: var(--figma-color-bg);
  }
  h1 { font-size: 13px; margin: 0 0 4px; }
  p.lead { margin: 0 0 14px; color: var(--figma-color-text-secondary); }
  label { display: block; margin-bottom: 10px; }
  label span { display: block; margin-bottom: 4px; color: var(--figma-color-text-secondary); }
  input {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--figma-color-border);
    border-radius: 5px;
    background: var(--figma-color-bg);
    color: var(--figma-color-text);
    font: inherit;
  }
  input:focus { outline: 2px solid var(--figma-color-border-brand-strong); outline-offset: -1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .check { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; color: var(--figma-color-text-secondary); }
  .check input { width: auto; }
  button {
    width: 100%;
    padding: 9px;
    border: 0;
    border-radius: 6px;
    background: var(--figma-color-bg-brand);
    color: var(--figma-color-text-onbrand);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }
  #log {
    margin-top: 12px;
    padding: 10px;
    min-height: 110px;
    max-height: 190px;
    overflow: auto;
    border-radius: 6px;
    background: var(--figma-color-bg-secondary);
    font: 11px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap;
  }
  #log a { color: var(--figma-color-text-brand); }
  .err { color: var(--figma-color-text-danger); }
  .ok { color: var(--figma-color-text-success); }
</style>

<h1>Variables → GitHub</h1>
<p class="lead">Commits this file's variables to <code>tokens/figma-variables.json</code>. GitHub Actions rebuilds and deploys Storybook in about 2 minutes.</p>

<label><span>Repository (owner/name)</span><input id="repo" placeholder="victorzumbanods/hmi-storybook" /></label>
<div class="row">
  <label><span>Branch</span><input id="branch" value="main" /></label>
  <label><span>Path</span><input id="path" value="tokens/figma-variables.json" /></label>
</div>
<label><span>GitHub token (fine-grained, Contents: read &amp; write)</span><input id="token" type="password" placeholder="github_pat_…" /></label>
<label class="check"><input id="remember" type="checkbox" checked /> Remember token on this computer</label>
<button id="sync">Sync variables to GitHub</button>
<div id="log">Ready.</div>

<script>
  const $ = (id) => document.getElementById(id)
  const log = (html, cls) => { $('log').innerHTML += `\n<span class="${cls || ''}">${html}</span>`; $('log').scrollTop = 1e9 }
  const send = (msg) => parent.postMessage({ pluginMessage: msg }, '*')
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

  const b64encode = (str) => { let bin = ''; for (const b of new TextEncoder().encode(str)) bin += String.fromCharCode(b); return btoa(bin) }
  const b64decode = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), (c) => c.charCodeAt(0)))

  function settings() {
    return { repo: $('repo').value.trim(), branch: $('branch').value.trim() || 'main', path: $('path').value.trim(), token: $('token').value.trim(), remember: $('remember').checked }
  }

  async function gh(s, path, opts = {}) {
    const res = await fetch(`https://api.github.com/repos/${s.repo}${path}`, {
      ...opts,
      headers: { Authorization: `Bearer ${s.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) },
    })
    return res
  }

  // Variable-level diff between the JSON on GitHub and the export.
  function diff(prevText, nextText) {
    let prev = {}
    try { prev = JSON.parse(prevText).meta.variables } catch (_) {}
    const next = JSON.parse(nextText).meta.variables
    const changes = []
    for (const [id, v] of Object.entries(next)) {
      if (v.remote) continue
      if (!prev[id]) changes.push(`+ ${v.name}`)
      else if (prev[id].name !== v.name) changes.push(`~ ${prev[id].name} → ${v.name}`)
      else if (JSON.stringify(prev[id]) !== JSON.stringify(v)) changes.push(`~ ${v.name}`)
    }
    for (const [id, v] of Object.entries(prev)) if (!next[id] && !v.remote) changes.push(`- ${v.name}`)
    return changes
  }

  let pending = null
  $('sync').onclick = () => {
    const s = settings()
    if (!/^[\w.-]+\/[\w.-]+$/.test(s.repo) || !s.token || !s.path) return log('Fill in repository, path and token.', 'err')
    send({ type: 'save-settings', settings: { ...s, token: s.remember ? s.token : '' } })
    $('sync').disabled = true
    $('log').textContent = 'Exporting variables…'
    pending = s
    send({ type: 'export' })
  }

  async function commit(s, data) {
    log(`${data.stats.variables} variables · ${data.stats.collections} collections${data.stats.remote ? ` · ${data.stats.remote} from libraries` : ''}`)
    log('Reading current file on GitHub…')
    const enc = encodeURIComponent(s.branch)
    const filePath = s.path.split('/').map(encodeURIComponent).join('/')
    const cur = await gh(s, `/contents/${filePath}?ref=${enc}`)
    let sha, prevText = ''
    if (cur.status === 200) {
      const j = await cur.json()
      sha = j.sha
      if (j.encoding === 'base64' && j.content) prevText = b64decode(j.content)
      else prevText = await (await gh(s, `/contents/${filePath}?ref=${enc}`, { headers: { Accept: 'application/vnd.github.raw+json' } })).text()
    } else if (cur.status !== 404) {
      throw new Error(`GitHub ${cur.status}: ${(await cur.json()).message}. Check the repository name and token permissions.`)
    }

    if (prevText === data.json) return log('No changes. GitHub is already up to date.', 'ok')

    const changes = diff(prevText, data.json)
    log(`${changes.length} variable change(s):\n${changes.slice(0, 15).map(esc).join('\n')}${changes.length > 15 ? `\n… and ${changes.length - 15} more` : ''}`)

    const message =
      `feat(tokens): ${changes.length} Figma variable change(s) from "${data.fileName}"\n\n` +
      changes.slice(0, 50).join('\n') + (changes.length > 50 ? `\n… and ${changes.length - 50} more` : '') +
      `\n\nSynced by ${data.user} with the HMI Variables → GitHub plugin.`

    const put = await gh(s, `/contents/${filePath}`, {
      method: 'PUT',
      body: JSON.stringify({ message, content: b64encode(data.json), branch: s.branch, ...(sha ? { sha } : {}) }),
    })
    const out = await put.json()
    if (!put.ok) throw new Error(`GitHub ${put.status}: ${out.message}`)
    log(`Committed <a href="${out.commit.html_url}" target="_blank">${out.commit.sha.slice(0, 7)}</a>. Storybook build: <a href="https://github.com/${s.repo}/actions" target="_blank">Actions</a>`, 'ok')
    send({ type: 'notify', text: `✓ ${changes.length} variable change(s) pushed to GitHub` })
  }

  onmessage = async (e) => {
    const msg = e.data.pluginMessage
    if (!msg) return
    if (msg.type === 'settings') {
      for (const k of ['repo', 'branch', 'path', 'token']) if (msg.settings[k]) $(k).value = msg.settings[k]
      if (msg.settings.remember === false) $('remember').checked = false
    } else if (msg.type === 'exported' && pending) {
      try { await commit(pending, msg) } catch (err) { log(esc(err.message), 'err'); send({ type: 'notify', text: err.message, error: true }) }
      pending = null
      $('sync').disabled = false
    } else if (msg.type === 'error') {
      log(esc(msg.message), 'err')
      pending = null
      $('sync').disabled = false
    }
  }

  send({ type: 'init' })
</script>
